# Archive a run that was not approved (reusable): records the reason, removes the preview, keeps the video private
# (or deletes it when config/channel.json says "on_reject": "delete") and closes the review issue.
name: Archive a run that was not approved

on:
  workflow_call:
    inputs:
      run:
        type: string
        required: true
      video_id:
        type: string
        required: true
      token:
        type: string
        required: true
      issue:
        type: string
        required: true
      source_run_id:
        description: Workflow run whose approval history holds the decision
        type: string
        required: true
      reason:
        description: Reason given with the label-based rejection (empty = read it from the approval history)
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  archive:
    name: Archive with the reason
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: write
      issues: write
      actions: read
    env:
      RUN: ${{ inputs.run }}
      VIDEO_ID: ${{ inputs.video_id }}
      TOKEN: ${{ inputs.token }}
    steps:
      - name: What happened to the approval request
        id: decision
        uses: actions/github-script@v7
        env:
          GIVEN_REASON: ${{ inputs.reason }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        with:
          script: |
            if (process.env.GIVEN_REASON) {
              core.setOutput('outcome', 'rejected');
              core.setOutput('reason', process.env.GIVEN_REASON);
              core.setOutput('by', context.actor);
              return;
            }
            const { owner, repo } = context.repo;
            const reviews = (await github.rest.actions.getReviewsForRun(
              { owner, repo, run_id: Number(process.env.SOURCE_RUN) })).data;
            const rejected = reviews.find(r => r.state === 'rejected');
            const approved = reviews.find(r => r.state === 'approved');
            if (rejected) {
              core.setOutput('outcome', 'rejected');
              core.setOutput('reason', rejected.comment || 'rejected without a comment');
              core.setOutput('by', rejected.user ? rejected.user.login : 'unknown');
            } else if (approved) {
              core.setOutput('outcome', 'failed-after-approval');
            } else {
              core.setOutput('outcome', 'expired');
              core.setOutput('reason', 'the approval request expired or was cancelled');
              core.setOutput('by', 'nobody');
            }
      - name: Approved but publication failed
        if: steps.decision.outputs.outcome == 'failed-after-approval'
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.ISSUE),
              body: `You approved this run, but publishing failed. Nothing was archived; see the logs: ${url}. ` +
                    'Re-run the failed job once the cause is fixed: staging and publishing are idempotent. If ' +
                    'YouTube kept the video private (API project not yet audited), set the repository variable ' +
                    'YOUTUBE_UPLOAD to manual first: the re-run then publishes the explainer and lists the files ' +
                    'to upload by hand.' });
      - uses: actions/checkout@v4
        if: steps.decision.outputs.outcome != 'failed-after-approval'
      - uses: actions/setup-python@v5
        if: steps.decision.outputs.outcome != 'failed-after-approval'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-publish.txt
      - uses: actions/download-artifact@v4
        if: steps.decision.outputs.outcome != 'failed-after-approval'
        with:
          name: run-final
          path: ${{ inputs.run }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Archive
        if: steps.decision.outputs.outcome != 'failed-after-approval'
        env:
          REASON: ${{ steps.decision.outputs.reason }}
          BY: ${{ steps.decision.outputs.by }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install -r requirements-publish.txt
          bash tools/ci/pages_checkout.sh site
          python3 tools/publish/site.py drop-preview site "$(basename "$RUN")" --token "$TOKEN"
          python3 tools/publish/site.py mark site "$RUN" --status rejected --reason "$REASON" --by "$BY"
          bash tools/ci/pages_push.sh site "Archive $(basename "$RUN"): not approved"
          on_reject="$(python3 -c 'import json; print(json.load(open("config/channel.json"))["youtube"]["on_reject"])')"
          if [ "$on_reject" = delete ] && [ -n "$VIDEO_ID" ]; then
            python3 tools/publish/youtube.py delete --video-id "$VIDEO_ID"
          fi
        shell: bash
      - name: Close the review issue with the reason
        if: steps.decision.outputs.outcome != 'failed-after-approval'
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
          REASON: ${{ steps.decision.outputs.reason }}
          BY: ${{ steps.decision.outputs.by }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE);
            await github.rest.issues.createComment({ ...context.repo, issue_number,
              body: `Not published (${process.env.BY}): ${process.env.REASON}\n\nThe run is archived with this reason ` +
                    '(archive/ on the Pages branch, and the run artifact for 90 days). The video stays private ' +
                    'unless config/channel.json asks to delete rejected videos.' });
            await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['pipeline:rejected'] });
            await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed' });
