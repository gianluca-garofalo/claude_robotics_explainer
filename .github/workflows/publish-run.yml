# No agent runs here: it starts only from an approved environment (`publish` or `publish-label`).
name: Publish an approved run

on:
  workflow_call:
    inputs:
      run:
        description: Run folder, for example runs/2026-11-02-some-topic
        type: string
        required: true
      video_id:
        description: YouTube video id; empty in manual YouTube mode (YOUTUBE_UPLOAD=manual)
        type: string
        required: true
      token:
        description: Preview path token
        type: string
        required: true
      issue:
        description: Review issue number
        type: string
        required: true
      environment:
        type: string
        required: true
      source_run_id:
        description: Workflow run that holds the run-final artifact
        type: string
        required: true

permissions: {}

jobs:
  publish:
    name: Publish (video, explainer, optional LinkedIn)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.links.outputs.explainer }}
    permissions:
      contents: write
      issues: write
      actions: read
    env:
      RUN: ${{ inputs.run }}
      VIDEO_ID: ${{ inputs.video_id }}
      TOKEN: ${{ inputs.token }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
      # Manual YouTube mode: nothing was uploaded, or YOUTUBE_UPLOAD was switched to manual after a failed attempt
      # (an unaudited API project keeps uploads private): you upload the approved video yourself.
      YT_MANUAL: ${{ inputs.video_id == '' || vars.YOUTUBE_UPLOAD == 'manual' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-publish.txt
      - run: pip install -r requirements-publish.txt
      - uses: actions/download-artifact@v4
        with:
          name: run-final
          path: ${{ inputs.run }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Pages branch
        run: bash tools/ci/pages_checkout.sh site
      - name: Links
        id: links
        run: |
          slug="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["slug"])' "$RUN/video/final/youtube.json")"
          echo "explainer=${SITE_BASE_URL%/}/explainers/$slug/" >> "$GITHUB_OUTPUT"
          echo "video=https://youtu.be/$VIDEO_ID" >> "$GITHUB_OUTPUT"
      - name: Make the video public (or schedule it)
        if: env.PUBLISH_ENABLED == 'true' && env.YT_MANUAL != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 tools/publish/youtube.py publish --video-id "$VIDEO_ID"
      - name: Series playlist (series episodes only)
        id: playlist
        if: env.PUBLISH_ENABLED == 'true' && env.YT_MANUAL != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -f "$RUN/episode.json" ]; then
            out="$(python3 tools/publish/youtube.py playlist "$RUN" --video-id "$VIDEO_ID" --ledger site/ledger.json)"
            echo "$out"
            id="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("playlist_id", ""))' "$out")"
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the explainer and code on Pages
        if: env.PUBLISH_ENABLED == 'true'
        env:
          PLAYLIST: ${{ steps.playlist.outputs.id }}
        run: |
          if [ "$YT_MANUAL" = true ]; then vid=""; else vid="$VIDEO_ID"; fi
          python3 tools/publish/site.py promote site "$RUN" --token "$TOKEN" --video-id "$vid"
          if [ -n "$PLAYLIST" ]; then
            python3 tools/publish/site.py mark site "$RUN" --status published --playlist "$PLAYLIST"
          fi
          bash tools/ci/pages_push.sh site "Publish $(basename "$RUN")"
      - name: LinkedIn post (optional)
        if: env.PUBLISH_ENABLED == 'true' && env.YT_MANUAL != 'true' && vars.LINKEDIN_ENABLED == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          EXPLAINER_URL: ${{ steps.links.outputs.explainer }}
          VIDEO_URL: ${{ steps.links.outputs.video }}
        run: |
          out="$(python3 tools/publish/linkedin.py post "$RUN" --video-url "$VIDEO_URL" \
                 --explainer-url "$EXPLAINER_URL" --ledger site/ledger.json)"
          echo "$out"
          post="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("post", ""))' "$out")"
          if [ -n "$post" ]; then
            python3 tools/publish/site.py mark site "$RUN" --status published --linkedin "$post"
            bash tools/ci/pages_push.sh site "LinkedIn post for $(basename "$RUN")"
          fi
      - name: Close the review issue
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
          EXPLAINER: ${{ steps.links.outputs.explainer }}
          VIDEO: ${{ steps.links.outputs.video }}
          ARTIFACTS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.source_run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE);
            const enabled = process.env.PUBLISH_ENABLED === 'true';
            const manual = process.env.YT_MANUAL === 'true';
            const slug = process.env.EXPLAINER.replace(/\/$/, '').split('/').pop();
            const body = !enabled
              ? 'Approved, but the repository variable PUBLISH_ENABLED is not "true": nothing was made public. ' +
                'The video stays private and the preview stays where it is.'
              : manual
              ? `Approved. The explainer is published: ${process.env.EXPLAINER}\n\nManual YouTube mode: download ` +
                `the run-final artifact from ${process.env.ARTIFACTS} and upload \`video/final/${slug}.mp4\` in ` +
                'YouTube Studio with `thumbnail.jpg`, the captions file and the title, description and tags from ' +
                '`youtube.json` (same folder).'
              : `Approved and published.\n\n- Video: ${process.env.VIDEO}\n- Explainer: ${process.env.EXPLAINER}`;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            if (enabled) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['pipeline:published'] });
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed' });
            }
