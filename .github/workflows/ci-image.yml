# Build the CI image (docker/Dockerfile) and push it to GitHub Container Registry as
# ghcr.io/<owner>/<repo>/explainer-ci:latest. Layers are cached in the GitHub Actions cache.
name: CI image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - requirements*.txt
      - config/channel.json           # the Piper voice baked into the image
      - tools/video/piper_model.py
      - package.json
      - package-lock.json
      - .github/workflows/ci-image.yml
  schedule:
    - cron: "41 3 1 * *"            # monthly rebuild for security updates of the base image
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/explainer-ci" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Remaining Action pipeline CI image (render, checks, gates)
          cache-from: type=gha
          cache-to: type=gha,mode=max
